AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: FF Academy backend - DynamoDB + Cognito + API Gateway + Lambdas

Parameters:
  AllowedOrigin:
    Type: String
    Default: "https://rselvidge.github.io"
    Description: CORS origin allowed to call the API (your GitHub Pages URL)
  BedrockModelId:
    Type: String
    Default: "anthropic.claude-3-5-haiku-20241022-v1:0"
    Description: Bedrock model used for league validation (falls back to mock data if unavailable)

Resources:
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ffa-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ffa-connections
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: connectionId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: connectionId
          KeyType: RANGE

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: ffa-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: ffa-web
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ["https://rselvidge.github.io", "http://localhost:5173"]
        AllowHeaders: ["authorization", "content-type"]
        AllowMethods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
        AllowCredentials: false
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient

  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/profile
      Handler: index.handler
      Runtime: nodejs24.x
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref UsersTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        GetProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /profile
            Method: GET
        PutProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /profile
            Method: PUT

  ConnectionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/connections
      Handler: index.handler
      Runtime: nodejs24.x
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref ConnectionsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
      Events:
        ListConnections:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /connections
            Method: GET
        CreateConnection:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /connections
            Method: POST
        UpdateConnection:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /connections/{connectionId}
            Method: PUT
        DeleteConnection:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /connections/{connectionId}
            Method: DELETE

  ValidateLeagueFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/validate-league
      Handler: index.handler
      Runtime: nodejs24.x
      Timeout: 30
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub "arn:aws:bedrock:*::foundation-model/${BedrockModelId}"
      Events:
        ValidateLeague:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /validate-league
            Method: POST

Outputs:
  ApiUrl:
    Description: API Gateway base URL (set as VITE_API_URL)
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Description: Cognito User Pool ID (set as VITE_COGNITO_USER_POOL_ID)
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito App Client ID (set as VITE_COGNITO_CLIENT_ID)
    Value: !Ref UserPoolClient
  UserPoolRegion:
    Description: Cognito region (set as VITE_COGNITO_REGION)
    Value: !Ref AWS::Region
